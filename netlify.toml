[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirect / to /es/ for Spanish browsers, /en/ for everyone else (including
# link-preview crawlers like WhatsApp's, which send no language), on the server,
# so anything that doesn't run JavaScript still lands on a page with its
# description and preview image. Netlify evaluates these top-to-bottom; first
# match wins. `force` makes them apply over the /index.html that Astro builds
# from its own `redirects` (for local dev), which would otherwise shadow them.
[[redirects]]
  from = "/"
  to = "/es/"
  status = 302
  force = true
  conditions = {Language = ["es"]}

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true
